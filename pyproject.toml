[project]
name = "i2c_drivers"
dynamic = ["version"]
description = "Drivers implementing i2c_api"
readme = "README.md"
authors = [
    { name = "Dmitri Priimak", email = "priimak@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "bitstring >= 5.0.0, < 6.0.0",
    "easymcp2221 >=1.8.4, <2.0.0",
    "i2c-api",
    "i2cdriver >=1.0.6, < 2.0.0",
    "pyftdi>=0.57.2",
]

[build-system]
requires = ["setuptools", "wheel", "setuptools-git-versioning"]
build-backend = "setuptools.build_meta"

[tool.setuptools-git-versioning]
enabled = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "F", # Pyflakes
    "E", # pycodestyle
    "W", # pycodestyle
    "B", # flake8-bugbear
    "I", # isort
]

[tool.uv.sources]
i2c-api = { git = "https://github.com/brainless-software/i2c_api.git", rev = "v0.20.0" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
]
